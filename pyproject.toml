[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veil"
version = "0.1.0"
description = "Reversible placeholders for personal information in what you send an LLM, through tool calls and back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
files = ["pypdf>=4", "Pillow>=13.0.0"]
tagger = ["gliner>=0.2.29", "torch>=2.4"]
tagger-onnx = ["onnxruntime>=1.17", "tokenizers>=0.15", "numpy>=1.24", "huggingface_hub>=0.21"]
bench = ["gliner>=0.2.29", "torch>=2.4", "wordfreq>=3.1", "transformers>=5.20.2", "presidio-analyzer>=2.2", "scrubadub>=2.0", "spacy>=3.7"]
bench-cloud = ["google-auth>=2.20", "requests>=2.31", "boto3>=1.34"]
dev = ["pytest>=8", "ruff>=0.5", "numpy>=1.24", "tokenizers>=0.15", "anthropic>=0.40", "pypdf>=4", "Pillow>=13.0.0"]

[tool.setuptools]
packages = ["veil"]

[tool.setuptools.package-data]
veil = ["data/*.txt.gz", "words/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["benchmarks/round7"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
